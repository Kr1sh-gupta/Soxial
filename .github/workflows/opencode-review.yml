name: opencode pr review

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: |
      github.repository == 'rabden/Soxial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'opencode-agent[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity and auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "rabden"
          git config --global user.email "rabden@users.noreply.github.com"
          git config --local --replace-all "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"

      - uses: anomalyco/opencode/github@latest
        id: review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            You are a senior code reviewer reviewing a pull request. Review the diff, changed files, and context below rigorously for: correctness and edge cases, bugs, security vulnerabilities, type safety and consistency with the codebase conventions, and maintainability. Be specific: reference file paths and line numbers. Categorize every finding as **Blocking** (must be fixed before merge) or **Non-blocking** (suggestion). Write your review as a structured markdown comment with a short summary, a "## Findings" section, and a "## Verdict" section. End your entire review with exactly one final line containing the machine-readable verdict, either:
            <!-- VERDICT: APPROVE -->
            or:
            <!-- VERDICT: CHANGES_REQUIRED -->

      - name: Set opencode-review status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          if [ "${{ steps.review.outcome }}" = "failure" ]; then
            state="failure"
            desc="opencode review could not run"
          else
            body=$(gh api "repos/rabden/Soxial/issues/${PR_NUM}/comments" --jq '[.[] | select(.user.login == "github-actions[bot]")] | sort_by(.created_at) | reverse | .[0].body')
            if echo "$body" | grep -q "VERDICT: CHANGES_REQUIRED"; then
              state="failure"
              desc="changes requested"
            else
              state="success"
              desc="approved"
            fi
          fi
          gh api -X POST "repos/rabden/Soxial/statuses/${SHA}" \
            -f state="$state" \
            -f context="opencode-review" \
            -f description="$desc" \
            -f target_url="https://github.com/rabden/Soxial/actions/runs/${{ github.run_id }}"
