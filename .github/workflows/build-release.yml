name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist_script: dist:linux
          - os: macos-latest
            dist_script: dist:mac
          - os: windows-latest
            dist_script: dist:win

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.dist_script }} -- --publish never

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Soxial ${{ github.ref_name }}" \
            --generate-notes 2>/dev/null || true
          find release -maxdepth 1 -type f | xargs -r \
            gh release upload ${{ github.ref_name }} --clobber
