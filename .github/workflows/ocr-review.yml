name: ocr pr review

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: |
      github.repository == 'rabden/Soxial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'opencode-agent[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: DEBUG endpoint probe
        env:
          LLM_URL: https://console.opencode.ai/inference/openai/v1/chat/completions
          LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
        run: |
          echo "--- A) plain chat ---"
          curl -sS -o /tmp/a.json -w "%{http_code}\n" -X POST "$LLM_URL" \
            -H "Authorization: Bearer $LLM_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4-flash-free","messages":[{"role":"user","content":"hi"}],"max_tokens":5}'
          head -c 600 /tmp/a.json; echo
          echo "--- B) with tools ---"
          curl -sS -o /tmp/b.json -w "%{http_code}\n" -X POST "$LLM_URL" \
            -H "Authorization: Bearer $LLM_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4-flash-free","messages":[{"role":"user","content":"weather in tokyo?"}],"max_tokens":40,"tools":[{"type":"function","function":{"name":"get_weather","description":"g","parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}}]}'
          head -c 600 /tmp/b.json; echo
          echo "--- C) with extra_body thinking ---"
          curl -sS -o /tmp/c.json -w "%{http_code}\n" -X POST "$LLM_URL" \
            -H "Authorization: Bearer $LLM_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4-flash-free","messages":[{"role":"user","content":"hi"}],"max_tokens":5,"thinking":{"type":"disabled"}}'
          head -c 600 /tmp/c.json; echo

      - name: Run OpenCodeReview
        id: ocr
        uses: alibaba/open-code-review@v1.8.6
        with:
          llm_url: https://console.opencode.ai/inference/openai/v1/chat/completions
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN }}
          llm_model: deepseek-v4-flash-free
          llm_use_anthropic: 'false'
          sticky_summary: 'true'
          incremental: 'true'

      - name: Set opencode-review status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          if [ "${{ steps.ocr.outcome }}" = "success" ]; then
            state="success"; desc="ocr review completed"
          else
            state="failure"; desc="ocr review failed"
          fi
          gh api -X POST "repos/rabden/Soxial/statuses/${SHA}" \
            -f state="$state" \
            -f context="opencode-review" \
            -f description="$desc" \
            -f target_url="https://github.com/rabden/Soxial/actions/runs/${{ github.run_id }}"
