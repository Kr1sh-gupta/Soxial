name: pr-agent review

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr_agent_job:
    if: |
      github.repository == 'rabden/Soxial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'opencode-agent[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.ZEN_API_KEY }}
          OPENAI.API_BASE: "https://opencode.ai/zen/v1"
          config.model: "openai/deepseek-v4-flash-free"
          config.fallback_models: '["openai/deepseek-v4-flash-free"]'
          config.custom_model_max_tokens: "64000"
          config.custom_reasoning_model: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
